<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>headerlock · seamless x profile alignment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=6.4.1" />
</head>
<body>
  <!-- Drag and drop full window overlay -->
  <div id="dropOverlay" class="drop-overlay" hidden>
    <div class="drop-box">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <span>Drop image here to load as Banner</span>
    </div>
  </div>

  <!-- Header Bar -->
  <header class="app-header">
    <div class="header-left">
      <a class="brand" href="./" aria-label="headerlock home">
        <span class="brand-icon" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="11" rx="2.5"/>
            <circle cx="7" cy="14" r="4.2"/>
            <path d="M7 12.2v3.6M5.2 14h3.6"/>
          </svg>
        </span>
        <span class="brand-text">headerlock</span>
        <span class="brand-badge">x</span>
      </a>
    </div>

    <div class="header-center">
      <div class="segmented-control" role="tablist" aria-label="Preview view">
        <button id="viewBoth" class="active" type="button" role="tab" aria-selected="true">Both</button>
        <button id="viewDesktop" type="button" role="tab" aria-selected="false">Desktop</button>
        <button id="viewMobile" type="button" role="tab" aria-selected="false">Mobile</button>
      </div>
    </div>

    <div class="header-right">
      <div class="header-status-chip" title="Seamless boundary lock active for X Desktop and Mobile layout">
        <span class="status-pulse-dot"></span>
        <span class="status-text">Boundary Lock</span>
        <span class="status-sep">/</span>
        <span class="status-meta">1500 × 500</span>
      </div>

      <button id="uploadBannerBtn" class="btn btn-ghost" type="button" title="Upload image (1500 × 500 or larger)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span>Upload Image</span>
      </button>

      <button id="exportBtn" class="btn btn-solid" type="button" title="Export aligned banner and avatar PNGs">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Export PNGs</span>
      </button>
    </div>
  </header>

  <!-- Workspace Stage -->
  <main class="stage" id="stage">
    <div id="viewsContainer" class="views-container view-both">
      
      <!-- Desktop Preview Card -->
      <section class="card desktop-view" id="desktopCard">
        <div class="card-bar">
          <div class="card-title">
            <span class="dot"></span>
            <span>Desktop Web</span>
          </div>
          <span class="card-meta">1500 × 500</span>
        </div>

        <div class="viewport desktop-viewport" title="Drag to pan · Scroll to zoom">
          <canvas id="desktopCanvas" class="preview-canvas" width="1500" height="720"></canvas>
          <div class="viewport-hint">drag to pan · scroll to zoom</div>
        </div>
      </section>

      <!-- Mobile Preview Card -->
      <section class="card mobile-view" id="mobileCard">
        <div class="card-bar">
          <div class="card-title">
            <span class="dot"></span>
            <span>Mobile App</span>
          </div>
          <span class="card-meta">X Android 12.2</span>
        </div>

        <div class="viewport mobile-viewport" title="Drag to pan · Scroll to zoom">
          <canvas id="mobileCanvas" class="preview-canvas" width="914" height="880"></canvas>
          <div class="viewport-hint">drag to pan · scroll to zoom</div>
        </div>
      </section>

    </div>

    <!-- Floating Minimal Bottom Dock -->
    <nav class="dock" aria-label="Editor controls">
      <div class="dock-group">
        <span class="dock-label">Target</span>
        <div class="dock-pills" role="radiogroup" aria-label="Alignment target">
          <button id="targetShared" class="dock-pill active" type="button">Shared</button>
          <button id="targetDesktop" class="dock-pill" type="button">Desktop</button>
          <button id="targetMobile" class="dock-pill" type="button">Mobile</button>
        </div>
      </div>

      <div class="dock-sep"></div>

      <div class="dock-group">
        <span class="dock-label">Zoom</span>
        <div class="dock-zoom">
          <button id="zoomOut" class="dock-btn" type="button" aria-label="Zoom out">−</button>
          <input id="zoomSlider" type="range" min="100" max="300" step="1" value="100" aria-label="Zoom level" />
          <span id="zoomValue" class="dock-num">100%</span>
          <button id="zoomIn" class="dock-btn" type="button" aria-label="Zoom in">＋</button>
        </div>
      </div>

      <div class="dock-sep"></div>

      <div class="dock-group">
        <span class="dock-label">Shape</span>
        <div class="dock-pills" role="radiogroup" aria-label="Avatar shape">
          <button id="shapeCircle" class="dock-pill active" type="button">Circle</button>
          <button id="shapeSquare" class="dock-pill" type="button">Square</button>
        </div>
      </div>

      <div class="dock-sep"></div>

      <div class="dock-group">
        <span class="dock-label">Extend</span>
        <div class="dock-pills" role="radiogroup" aria-label="Feature extension below banner edge">
          <button id="extendOn" class="dock-pill active" type="button" title="Extend banner features into lower avatar">On</button>
          <button id="extendOff" class="dock-pill" type="button" title="Cut off at banner bottom edge">Off</button>
        </div>
      </div>

      <div class="dock-sep"></div>

      <button id="resetBtn" class="dock-action" type="button" title="Reset pan, zoom & avatar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        <span>Reset</span>
      </button>
    </nav>
  </main>

  <!-- Floating Theme Toggle Button -->
  <button id="themeToggleBtn" class="theme-toggle" type="button" title="Toggle Light / Dark Theme" aria-label="Toggle theme">
    <svg class="theme-icon sun-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2"/>
      <path d="M12 20v2"/>
      <path d="m4.93 4.93 1.41 1.41"/>
      <path d="m17.66 17.66 1.41 1.41"/>
      <path d="M2 12h2"/>
      <path d="M20 12h2"/>
      <path d="m6.34 17.66-1.41 1.41"/>
      <path d="m19.07 4.93-1.41 1.41"/>
    </svg>
    <svg class="theme-icon moon-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    </svg>
  </button>

  <!-- Hidden elements for file upload -->
  <input id="bannerInput" type="file" accept="image/*" style="display: none;" />

  <!-- Clean Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./app.js?v=6.4.1"></script>
</body>
</html>
